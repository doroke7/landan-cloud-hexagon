syntax = "proto3";

package pb.resource.logic;

option go_package = "./pb_resource_logic";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "resource/logic/game.proto";

service TableLogic {
  rpc ShowTablesTotalByWheresWithOrdersLimit(TableShowTablesTotalByWheresWithOrdersLimitInput) returns (TableShowTablesTotalByWheresWithOrdersLimitOutput);
}

message Table {
  uint32 id = 1;
  string no = 2;
  uint32 game_id = 3;
  string key = 4;
  uint32 state = 5;
  string description = 6;
  string result = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp deleted_at = 12;
  Game game = 13;
}

message TableWhere {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
}


message TableOrder {
  string field = 1;
  string value = 2;

}

message TableLimit {
  uint64 offset = 1;
  uint64 count = 2;
}

message TableShowTablesTotalByWheresWithOrdersLimitInput {
  repeated TableWhere wheres = 1;
  repeated TableOrder orders = 2;
  TableLimit limit = 3;
}

message TableShowTablesTotalByWheresWithOrdersLimitOutput {
  repeated Table tables = 1;
  uint64 total = 2;
}
