syntax = "proto3";

package pb.resource.logic;

option go_package = "./pb_resource_logic";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service GameLogic {
  rpc ShowGamesTotalByWheresWithOrdersLimit(GameShowGamesTotalByWheresWithOrdersLimitInput) returns (GameShowGamesTotalByWheresWithOrdersLimitOutput);

}

message GameType {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message Game {
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
  GameType game_type = 9;
}

message GameWhere {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;

}

message GameOrder {
  string field = 1;
  string value = 2;

}


message GameLimit {
  uint64 offset = 1;
  uint64 count = 2;
}

message GameShowGamesTotalByWheresWithOrdersLimitInput {
  repeated GameWhere wheres = 1;
  repeated GameOrder orders = 2;
  GameLimit limit = 3;
}



message GameShowGamesTotalByWheresWithOrdersLimitOutput {
  repeated Game games = 1;
  uint64 total = 2;
}

