syntax = "proto3";

package pb.resource.model;

option go_package = "./pb_resource_model";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service GameModel {
  rpc AddOne(GameAddOneInput) returns (GameAddOneOutput);
  rpc ShowOneById(GameShowOneByIdInput) returns (GameShowOneByIdOutput);
  rpc ShowOnesByWheresWithOrdersLimit(GameShowOnesByWheresWithOrdersLimitInput) returns (GameShowOnesByWheresWithOrdersLimitOutput);
  rpc EditOneById(GameEditOneByIdInput) returns (GameEditOneByIdOutput);
  rpc RemoveOneById(GameRemoveOneByIdInput) returns (GameRemoveOneByIdOutput);
  rpc TotalByWheres(GameTotalByWheresInput) returns (GameTotalByWheresOutput);

}


message GameWhere {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
}

message GameOrder {
  string field = 1;
  string value = 2;
}



message GameLimit {
  uint64 offset = 1;
  uint64 count = 2;
}

message GameType {
  uint32 id = 1;
  string key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
}

message Game{
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
  GameType game_type = 9;
}

message GameAddOneInput{
  optional uint32 game_type_id = 1;
  optional string key = 2;
  optional string name = 3;
  optional string description = 4;
}

message GameAddOneOutput{
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
}

message GameShowOneByIdInput{
  uint32 id = 1;
}

message GameShowOneByIdOutput{
  uint32 id = 1;
  uint32 game_type_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp deleted_at = 8;
  GameType game_type = 9;
}

message GameEditOneByIdInput{
  uint32 id = 1;
  optional uint32 game_type_id = 2;
  optional string key = 3;
  optional string name = 4;
  optional string description = 5;
}


message GameEditOneByIdOutput{
  bool status = 1;
}



message GameRemoveOneByIdInput{
  uint32 id = 1;
}

message GameRemoveOneByIdOutput{
  bool status = 1;
}

message GameShowOnesByWheresWithOrdersLimitInput{
  repeated GameWhere wheres = 2;
  repeated GameOrder orders = 3;
  GameLimit limit = 1;
}


message GameShowOnesByWheresWithOrdersLimitOutput{
  repeated Game games = 1;
}



message GameTotalByWheresInput{
  repeated GameWhere wheres = 1;
}


message GameTotalByWheresOutput{
  uint64 total = 1;
}
